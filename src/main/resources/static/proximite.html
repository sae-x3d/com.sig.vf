<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJET SIG — Recherche par proximité</title>
<link rel="stylesheet" href="/lib/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; }

nav {
  background: #2c3e50; color: #fff; display: flex; align-items: center;
  padding: 0 20px; height: 50px; gap: 24px;
}
nav .brand { font-weight: 700; font-size: 18px; }
nav a { color: #bbb; text-decoration: none; font-size: 14px; }
nav a:hover, nav a.active { color: #fff; }

#map { height: calc(100vh - 50px - 200px); width: 100%; }

#bottom {
  height: 200px; background: #fff; padding: 14px 20px; display: flex; gap: 24px;
  overflow-y: auto; border-top: 2px solid #eee;
}
#left-panel { min-width: 250px; }
#left-panel h3 { font-size: 15px; margin-bottom: 8px; }
#left-panel p { font-size: 13px; color: #666; margin-bottom: 4px; }
#left-panel .label { font-weight: 600; color: #333; }
#results { flex: 1; overflow-y: auto; }
#results .item {
  display: inline-block; margin: 4px; padding: 6px 12px; border-radius: 20px;
  font-size: 13px; color: #fff; cursor: pointer;
}
#results .item:hover { opacity: .8; }
#results .empty { color: #999; font-style: italic; margin-top: 20px; }

.controls {
  position: absolute; top: 60px; right: 10px; z-index: 1000;
  background: rgba(255,255,255,.95); padding: 12px 16px; border-radius: 8px;
  box-shadow: 0 2px 10px rgba(0,0,0,.2); width: 200px;
}
.controls label { font-weight: 600; font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
.controls input[type="range"] { width: 100%; }
.controls .val { font-size: 20px; font-weight: 700; color: #2c3e50; text-align: center; }
.controls .unit { font-size: 12px; color: #888; }
.controls .btn-secondary {
  padding: 6px 14px; border: none; border-radius: 4px; font-size: 13px;
  cursor: pointer; background: #95a5a6; color: #fff;
}
.controls .btn-secondary:hover { background: #7f8c8d; }
.controls .toggle {
  display: block; width: 100%; margin-top: 6px; padding: 6px 14px; border: none;
  border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: 600;
}
.controls .toggle.on { background: #27ae60; color: #fff; }
.controls .toggle.off { background: #95a5a6; color: #fff; }
.controls .toggle:hover { opacity: .85; }

.instruction {
  position: absolute; top: 60px; left: 10px; z-index: 1000;
  background: rgba(255,255,255,.95); padding: 10px 16px; border-radius: 8px;
  box-shadow: 0 2px 10px rgba(0,0,0,.2); font-size: 14px; max-width: 280px;
}

#detailModal {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,.4); z-index: 9999; align-items: center; justify-content: center;
}
#detailModal.open { display: flex; }
#detailModal .modal-content {
  background: #fff; border-radius: 12px; padding: 28px; width: 90%; max-width: 520px;
  max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.2);
  position: relative;
}
#detailModal .close {
  position: absolute; top: 10px; right: 14px; cursor: pointer; font-size: 24px;
  color: #999; background: none; border: none;
}
#detailModal .close:hover { color: #333; }
#detailModal h2 { margin-bottom: 4px; font-size: 20px; }
#detailModal .detail-type {
  display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px;
  color: #fff; margin-bottom: 12px;
}
#detailModal .info-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; margin: 12px 0; }
#detailModal .info-grid .lbl { color: #888; font-weight: 600; }
#detailModal .osm-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid #eee; }
#detailModal .osm-section h4 { font-size: 14px; color: #555; margin-bottom: 8px; }
#detailModal .osm-section .loading { color: #999; font-style: italic; }
#detailModal .osm-section .error { color: #e74c3c; font-size: 13px; }
#detailModal .osm-section .data-item { font-size: 13px; padding: 3px 0; }
#detailModal .osm-section .data-item .k { color: #888; }
#detailModal .stars { color: #f39c12; }
#detailModal .route-btn {
  display: block; width: 100%; margin-top: 12px; padding: 10px; border: none;
  border-radius: 8px; background: #27ae60; color: #fff; cursor: pointer;
  font-size: 14px; font-weight: 600; transition: background .15s;
}
#detailModal .route-btn:hover { background: #219a52; }

@media (max-width: 700px) {
  #bottom { flex-direction: column; height: auto; }
  #map { height: calc(100vh - 50px - 320px); }
}
</style>
</head>
<body>
<nav>
  <span class="brand">  PROJET SIG</span>
  <a href="/">Carte</a>
  <a href="/statistiques.html">Statistiques</a>
  <a href="/classement.html">Classement</a>
  <a href="/proximite.html" class="active">Proximité</a>
  <a href="/gestion.html">Gestion</a>
</nav>

<div id="map"></div>


<div class="controls">
  <label>Rayon de recherche</label>
  <div class="val"><span id="radiusVal">500</span> <span class="unit">m</span></div>
  <input type="range" id="radiusSlider" min="100" max="2000" value="500" step="50">
  <button id="locBtn" style="width:100%;margin-top:8px;" class="btn-secondary">📍 Ma position</button>
  <button id="toggleProx" class="toggle on">🔍 Proximité</button>
</div>

<div id="bottom">
  <div id="left-panel">
    <h3>📍 Point de recherche</h3>
    <p><span class="label">Latitude :</span> <span id="infoY">—</span></p>
    <p><span class="label">Longitude :</span> <span id="infoX">—</span></p>
    <p><span class="label">Rayon :</span> <span id="infoRadius">500</span> m</p>
    <p><span class="label">Résultats :</span> <span id="infoCount">0</span></p>
  </div>
  <div id="results"></div>
</div>

<div id="detailModal">
  <div class="modal-content">
    <button class="close" id="modalClose">&times;</button>
    <h2 id="detName"></h2>
    <span class="detail-type" id="detType"></span>
    <div class="info-grid">
      <span class="lbl">Note</span><span class="stars" id="detNote"></span>
      <span class="lbl">Longitude</span><span id="detX"></span>
      <span class="lbl">Latitude</span><span id="detY"></span>
      <span class="lbl">Fokontany</span><span id="detFoko">—</span>
    </div>
    <div class="osm-section">
      <h4>📋 Données OpenStreetMap</h4>
      <div id="osmInfo"><span class="loading">Recherche en cours…</span></div>
    </div>
    <button class="route-btn" id="routeBtn">🚗 Itinéraire vers cet établissement</button>
  </div>
</div>

<div id="routePanel" style="display:none;position:absolute;bottom:210px;left:10px;z-index:1000;background:rgba(255,255,255,.95);padding:10px 14px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:13px;max-width:300px">
  <div id="routeInfo"><span style="font-weight:600">🚗 Itinéraire</span></div>
  <button id="routeClearBtn" style="margin-top:6px;padding:3px 10px;border:none;border-radius:4px;background:#e74c3c;color:#fff;cursor:pointer;font-size:11px">✕ Effacer</button>
</div>

<script src="/lib/leaflet.js"></script>
<script>
const map = L.map('map').setView([-18.91, 47.53], 14);
L.tileLayer('/tiles/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

let centerMarker = null;
let circle = null;
let resultMarkers = L.layerGroup().addTo(map);
let routeLine = null;
let routeStartMarker = null;
let pickStartMode = false;
let pendingDest = null;
let currentEtab = null;
let selectMarker = null;
let proximityActive = true;

const radiusSlider = document.getElementById('radiusSlider');
const radiusVal = document.getElementById('radiusVal');
const infoY = document.getElementById('infoY');
const infoX = document.getElementById('infoX');
const infoRadius = document.getElementById('infoRadius');
const infoCount = document.getElementById('infoCount');
const resultsEl = document.getElementById('results');

function createIcon(type) {
  const color = type === 'restaurant' ? '#e74c3c' : '#3498db';
  return L.divIcon({
    className: '',
    html: `<div style="width:12px;height:12px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);"></div>`,
    iconSize: [12, 12], iconAnchor: [6, 6]
  });
}

function formatDist(m) { return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m'; }
function formatTime(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h > 0 ? h + ' h ' + m + ' min' : m + ' min'; }
function formatNote(note) {
  const full = '★'.repeat(Math.round(note));
  const empty = '☆'.repeat(5 - Math.round(note));
  return full + ' ' + note.toFixed(1);
}

function openDetail(e) {
  currentEtab = e;
  document.getElementById('detName').textContent = e.nom;
  const badge = document.getElementById('detType');
  badge.textContent = e.type === 'restaurant' ? 'Restaurant' : 'Hôtel';
  badge.style.background = e.type === 'restaurant' ? '#e74c3c' : '#3498db';
  document.getElementById('detNote').innerHTML = formatNote(e.note);
  document.getElementById('detX').textContent = e.x.toFixed(5);
  document.getElementById('detY').textContent = e.y.toFixed(5);
  document.getElementById('detFoko').textContent = 'Recherche…';

  fetch('/api/fokontany/search?x=' + e.x + '&y=' + e.y)
    .then(r => r.json())
    .then(f => { document.getElementById('detFoko').textContent = f.nom + ' (' + f.arrondissement + ')'; })
    .catch(() => { document.getElementById('detFoko').textContent = '—'; });

  const osmDiv = document.getElementById('osmInfo');
  osmDiv.innerHTML = '<span class="loading">Recherche en cours…</span>';
  fetch('/api/osm/search?nom=' + encodeURIComponent(e.nom) + '&y=' + e.y + '&x=' + e.x)
    .then(r => r.json())
    .then(data => {
      if (data.error === 'hors-ligne') {
        osmDiv.innerHTML = '<span class="error">Hors ligne — données OSM non disponibles.</span>';
        return;
      }
      const el = data.elements?.[0];
      if (!el || !el.tags) {
        osmDiv.innerHTML = '<span class="error">Aucune donnée OSM trouvée.</span>';
        return;
      }
      const t = el.tags;
      let html = '';
      if (t['addr:street']) html += '<div class="data-item"><span class="k">Adresse :</span> ' + t['addr:street'] + (t['addr:housenumber'] ? ' ' + t['addr:housenumber'] : '') + '</div>';
      if (t['addr:city']) html += '<div class="data-item"><span class="k">Ville :</span> ' + t['addr:city'] + '</div>';
      if (t.phone) html += '<div class="data-item"><span class="k">Téléphone :</span> ' + t.phone + '</div>';
      if (t.website) html += '<div class="data-item"><span class="k">Site web :</span> <a href="' + t.website + '" target="_blank">' + t.website + '</a></div>';
      if (t.email) html += '<div class="data-item"><span class="k">Email :</span> ' + t.email + '</div>';
      if (t.opening_hours) html += '<div class="data-item"><span class="k">Horaires :</span> ' + t.opening_hours + '</div>';
      if (t.cuisine) html += '<div class="data-item"><span class="k">Cuisine :</span> ' + t.cuisine + '</div>';
      if (t.stars) html += '<div class="data-item"><span class="k">Étoiles :</span> ' + t.stars + '</div>';
      if (!html) html = '<span class="error">Aucune information détaillée disponible.</span>';
      osmDiv.innerHTML = html;
    })
    .catch(() => { osmDiv.innerHTML = '<span class="error">Impossible de contacter le serveur.</span>'; });

  document.getElementById('detailModal').classList.add('open');
}

function selectItem(el, y, x, nom) {
  if (selectMarker) {
    resultMarkers.removeLayer(selectMarker);
    selectMarker = null;
  }
  const found = resultMarkers.getLayers().find(m => {
    const p = m.getLatLng();
    return p.lat === y && p.lng === x;
  });
  if (found) resultMarkers.removeLayer(found);
  selectMarker = L.marker([y, x], {
    icon: L.divIcon({
      className: '',
      html: '<div style="width:22px;height:22px;border-radius:50%;background:#2c3e50;border:4px solid #f1c40f;box-shadow:0 2px 8px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:12px">📍</div>',
      iconSize: [22, 22], iconAnchor: [11, 11]
    })
  }).addTo(resultMarkers);
  if (nom) selectMarker.on('dblclick', () => routeTo(y, x, nom));
}

function clearRoute() {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if (routeStartMarker) { map.removeLayer(routeStartMarker); routeStartMarker = null; }
  document.getElementById('routePanel').style.display = 'none';
}

function routeTo(lat, lng, nom) {
  pendingDest = { lat, lng, nom };
  const panel = document.getElementById('routePanel');
  panel.innerHTML =
    '<div style="font-weight:600;margin-bottom:6px">🚗 Choisir le départ</div>' +
    '<button id="choicePos" style="display:block;width:100%;padding:8px;margin-bottom:6px;border:none;border-radius:6px;background:#27ae60;color:#fff;cursor:pointer;font-size:13px">📍 Ma position</button>' +
    '<button id="choiceMap" style="display:block;width:100%;padding:8px;border:none;border-radius:6px;background:#3388ff;color:#fff;cursor:pointer;font-size:13px">👆 Choisir sur la carte</button>' +
    '<button id="cancelChoice" style="margin-top:6px;padding:4px 12px;border:none;border-radius:4px;background:#e74c3c;color:#fff;cursor:pointer;font-size:11px">✕ Annuler</button>';
  panel.style.display = 'block';

  function doRoute(startLat, startLng) {
    fetch('/api/routing?startLon=' + startLng + '&startLat=' + startLat + '&endLon=' + lng + '&endLat=' + lat)
      .then(r => r.json())
      .then(data => {
        if (data.code !== 'Ok' || !data.routes || !data.routes.length) { alert('Aucun itinéraire'); return; }
        const route = data.routes[0];
        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
        clearRoute();
        routeStartMarker = L.marker([startLat, startLng], {
          icon: L.divIcon({
            className: '',
            html: '<div style="width:20px;height:20px;border-radius:50%;background:#27ae60;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:10px">D</div>',
            iconSize: [20, 20], iconAnchor: [10, 10]
          })
        }).addTo(map);
        routeLine = L.polyline(coords, { color: '#3388ff', weight: 5, opacity: 0.8 }).addTo(map);
        map.fitBounds(routeLine.getBounds().pad(0.2));
        panel.innerHTML =
          '<div style="font-weight:600;margin-bottom:4px">🚗 ' + nom + '</div>' +
          '<div style="color:#555;margin-bottom:2px">Distance : ' + formatDist(route.distance) + '</div>' +
          '<div style="color:#555;margin-bottom:6px">Durée : ' + formatTime(route.duration) + '</div>' +
          '<button id="routeClearBtn" style="padding:4px 12px;border:none;border-radius:4px;background:#e74c3c;color:#fff;cursor:pointer;font-size:11px">✕ Effacer</button>';
        panel.style.display = 'block';
        document.getElementById('routeClearBtn').addEventListener('click', clearRoute);
      })
      .catch(() => alert('Service indisponible'));
  }

  document.getElementById('choicePos').addEventListener('click', () => {
    panel.style.display = 'none';
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        p => doRoute(p.coords.latitude, p.coords.longitude),
        () => doRoute(-18.91, 47.53),
        { enableHighAccuracy: true, timeout: 5000 }
      );
    } else {
      doRoute(-18.91, 47.53);
    }
  });

  document.getElementById('choiceMap').addEventListener('click', () => {
    panel.innerHTML = '<div style="font-weight:600;margin-bottom:6px">👆 Cliquez sur la carte pour définir le départ</div>';
    pickStartMode = true;
    map.getContainer().style.cursor = 'crosshair';
  });

  document.getElementById('cancelChoice').addEventListener('click', () => {
    panel.style.display = 'none';
    pickStartMode = false;
    pendingDest = null;
    map.getContainer().style.cursor = '';
  });
}

map.on('click', e => {
  if (pickStartMode || !proximityActive) return;
  const radius = parseInt(radiusSlider.value);
  doSearch(e.latlng.lng, e.latlng.lat, radius);
});

map.on('click', function(e) {
  if (!pickStartMode || !pendingDest) return;
  pickStartMode = false;
  map.getContainer().style.cursor = '';
  const d = pendingDest;
  pendingDest = null;
  function doRoute(startLat, startLng) {
    fetch('/api/routing?startLon=' + startLng + '&startLat=' + startLat + '&endLon=' + d.lng + '&endLat=' + d.lat)
      .then(r => r.json())
      .then(data => {
        if (data.code !== 'Ok' || !data.routes || !data.routes.length) { alert('Aucun itinéraire'); return; }
        const route = data.routes[0];
        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
        clearRoute();
        routeStartMarker = L.marker([startLat, startLng], {
          icon: L.divIcon({
            className: '',
            html: '<div style="width:20px;height:20px;border-radius:50%;background:#27ae60;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:10px">D</div>',
            iconSize: [20, 20], iconAnchor: [10, 10]
          })
        }).addTo(map);
        routeLine = L.polyline(coords, { color: '#3388ff', weight: 5, opacity: 0.8 }).addTo(map);
        map.fitBounds(routeLine.getBounds().pad(0.2));
        const panel = document.getElementById('routePanel');
        panel.innerHTML =
          '<div style="font-weight:600;margin-bottom:4px">🚗 ' + d.nom + '</div>' +
          '<div style="color:#555;margin-bottom:2px">Distance : ' + formatDist(route.distance) + '</div>' +
          '<div style="color:#555;margin-bottom:6px">Durée : ' + formatTime(route.duration) + '</div>' +
          '<button id="routeClearBtn" style="padding:4px 12px;border:none;border-radius:4px;background:#e74c3c;color:#fff;cursor:pointer;font-size:11px">✕ Effacer</button>';
        panel.style.display = 'block';
        document.getElementById('routeClearBtn').addEventListener('click', clearRoute);
      })
      .catch(() => alert('Service indisponible'));
  }
  doRoute(e.latlng.lat, e.latlng.lng);
});

function doSearch(x, y, radius) {
  if (pickStartMode || !proximityActive) return;
  if (!x || !y) return;
  infoX.textContent = x.toFixed(5);
  infoY.textContent = y.toFixed(5);
  infoRadius.textContent = radius;

  if (centerMarker) {
    centerMarker.setLatLng([y, x]);
  } else {
    centerMarker = L.marker([y, x], {
      icon: L.divIcon({
        className: '',
        html: '<div style="width:18px;height:18px;border-radius:50%;background:#e74c3c;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);"></div>',
        iconSize: [18, 18], iconAnchor: [9, 9]
      })
    }).addTo(map);
  }

  if (circle) map.removeLayer(circle);
  if (selectMarker) { resultMarkers.removeLayer(selectMarker); selectMarker = null; }
  circle = L.circle([y, x], { radius, color: '#e74c3c', fillOpacity: 0.08, weight: 2 }).addTo(map);
  map.fitBounds(circle.getBounds().pad(0.2));

  fetch('/api/etablissements/proximity?x=' + x + '&y=' + y + '&radius=' + radius)
    .then(r => r.json())
    .then(data => {
      resultMarkers.clearLayers();
      data.forEach(e => {
        const m = L.marker([e.y, e.x], { icon: createIcon(e.type) }).addTo(resultMarkers);
        m.bindPopup('<b>' + e.nom + '</b><br>' + e.type + '<br>Note: ' + e.note.toFixed(1));
        m.on('dblclick', () => routeTo(e.y, e.x, e.nom));
      });
      infoCount.textContent = data.length;

      if (data.length) {
        resultsEl.innerHTML = data.map((e, i) => {
          const escNom = e.nom.replace(/'/g, "\\'");
          return `<span class="item" data-idx="${i}" style="background:${e.type === 'restaurant' ? '#e74c3c' : '#3498db'}"
                 onclick="selectItem(this,${e.y},${e.x},'${escNom}')"
                 ondblclick="openDetail({nom:'${escNom}',type:'${e.type}',note:${e.note},x:${e.x},y:${e.y}})"
                 oncontextmenu="event.preventDefault();routeTo(${e.y},${e.x},'${escNom}')"
                 title="Clic = centrer · Double-clic = détails · Clic droit = itinéraire">${e.nom}
           <span style="margin-left:6px;font-size:11px;opacity:.8">🚗</span></span>`;
        }).join('');
      } else {
        resultsEl.innerHTML = '<div class="empty">Aucun établissement trouvé dans ce rayon</div>';
      }
    });
}

radiusSlider.addEventListener('input', () => {
  const val = parseInt(radiusSlider.value);
  radiusVal.textContent = val;
  if (centerMarker) {
    const pos = centerMarker.getLatLng();
    doSearch(pos.lng, pos.lat, val);
  }
});

document.getElementById('locBtn').addEventListener('click', () => {
  if (!navigator.geolocation) return alert('Géolocalisation non disponible');
  navigator.geolocation.getCurrentPosition(
    p => {
      const lat = p.coords.latitude, lng = p.coords.longitude;
      map.setView([lat, lng], 15);
      doSearch(lng, lat, parseInt(radiusSlider.value));
    },
    e => alert('Erreur: ' + e.message),
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

document.getElementById('toggleProx').addEventListener('click', function() {
  proximityActive = !proximityActive;
  this.textContent = proximityActive ? '🔍 Proximité' : '🚫 Proximité';
  this.className = 'toggle ' + (proximityActive ? 'on' : 'off');
});

document.getElementById('routeClearBtn').addEventListener('click', clearRoute);

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('detailModal').classList.remove('open');
});
document.getElementById('detailModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('detailModal').classList.remove('open');
});

document.getElementById('routeBtn').addEventListener('click', function() {
  if (!currentEtab) return;
  document.getElementById('detailModal').classList.remove('open');
  routeTo(currentEtab.y, currentEtab.x, currentEtab.nom);
});
</script>
</body>
</html>
